apiVersion: v1
kind: ConfigMap
metadata:
  name: runai-app-config
  namespace: default
  labels:
    app: runai-app
    component: config
data:
  # Run:ai Control Plane Configuration
  RUNAI_CONTROL_PLANE: "runai.example.com"
  RUNAI_APP_NAME: "your-app-name"
  
  # Additional configuration options
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  
  # Nginx configuration
  NGINX_WORKER_PROCESSES: "auto"
  NGINX_WORKER_CONNECTIONS: "1024"
  
  # Application settings
  CACHE_CLEAR_INTERVAL: "60000"  # 60 seconds in milliseconds
  AUTO_REFRESH_INTERVAL: "60000"  # 60 seconds in milliseconds
  
---
apiVersion: v1
kind: Secret
metadata:
  name: runai-app-secret
  namespace: default
  labels:
    app: runai-app
    component: secret
type: Opaque
data:
  # Base64 encoded secret: echo -n "REDACTED" | base64
  RUNAI_APP_SECRET: REDACTED