apiVersion: v1
kind: Service
metadata:
  name: runai-app
  namespace: default
  labels:
    app: runai-app
    component: service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: runai-app

---
# Optional: NodePort service for direct access (alternative to port-forward)
apiVersion: v1
kind: Service
metadata:
  name: runai-app-nodeport
  namespace: default
  labels:
    app: runai-app
    component: nodeport-service
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
    # nodePort: 30300  # Uncomment to specify a specific NodePort
  selector:
    app: runai-app

---
# Optional: Ingress for external access with custom domain
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runai-app-ingress
  namespace: default
  labels:
    app: runai-app
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: runai-app.local  # Change this to your desired hostname
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: runai-app
            port:
              number: 3000
