apiVersion: apps/v1
kind: Deployment
metadata:
  name: runai-app
  namespace: default
  labels:
    app: runai-app
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runai-app
  template:
    metadata:
      labels:
        app: runai-app
        version: v1.0.0
    spec:
      containers:
      - name: runai-app
        image: ghcr.io/chadchappy/runai-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: runai-app-config
        
        # Secret environment variables
        env:
        - name: RUNAI_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: runai-app-secret
              key: RUNAI_APP_SECRET
        
        # Health checks temporarily disabled for debugging
        
        # Resource limits and requests
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Security context - temporarily disabled for configuration
        # securityContext:
        #   runAsNonRoot: true
        #   runAsUser: 101  # nginx user
        #   allowPrivilegeEscalation: false
        #   readOnlyRootFilesystem: false
        #   capabilities:
        #     drop:
        #     - ALL

      # Pod security context - temporarily disabled
      # securityContext:
      #   fsGroup: 101
      
      # Restart policy
      restartPolicy: Always
      
      # DNS policy
      dnsPolicy: ClusterFirst
